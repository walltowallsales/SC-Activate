<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="format-detection" content="telephone=no"><title>Item - Activate Listing</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:720px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:22px}h1{font-size:27px;margin:0}.ver{font-size:13px;color:#667}.conn{font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px;background:#e9ecef;text-align:center;white-space:nowrap}
.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px #00000010;margin-bottom:15px}label{font-weight:700;display:block;margin-bottom:7px}input{width:100%;font-size:21px;padding:14px;border:2px solid #aeb7c0;border-radius:11px}
button,a.btn{width:100%;border:0;border-radius:11px;padding:14px;font-size:18px;font-weight:800;margin-top:10px;cursor:pointer;text-decoration:none;text-align:center;display:block}.search{background:#1769aa;color:white}.activate{background:#16823b;color:white;font-size:22px;padding:17px}.seller{background:#b8e5c4;color:#123d1d}.clear{background:#e9ecef;color:#333}
.product{display:none}.row{display:flex;gap:16px}.pic{width:135px;height:135px;object-fit:contain;border:1px solid #ddd;border-radius:12px;background:#fff}.info{flex:1}.sku{font-size:24px;font-weight:900}.title{font-size:18px;margin:6px 0 12px}.badge{display:inline-block;padding:8px 12px;border-radius:9px;font-weight:900}.active{background:#d7f3df;color:#12612c}.inactive{background:#ffd9d9;color:#9a1818}.msg{padding:12px;border-radius:10px;margin-top:12px;font-weight:700}.ok{background:#dff5e5;color:#165d2b}.err{background:#ffe0e0;color:#8a1818}.wait{background:#fff2c7;color:#6d5300}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:white;border-radius:16px;padding:22px;max-width:390px;width:100%}.modalbox h2{margin-top:0}.modalbuttons{display:flex;gap:10px}.modalbuttons button{width:50%}
@media(max-width:520px){.row{display:block}.pic{width:100%;height:190px;margin-bottom:12px}h1{font-size:23px}.conn{font-size:11px}}
.diag{margin-top:12px;border-top:2px solid #ddd;padding-top:10px}.diag h3{margin:4px 0 8px}.attempt{font-size:13px;line-height:1.35;background:#f5f6f7;border-radius:9px;padding:9px;margin:7px 0;overflow-wrap:anywhere}.attempt strong{font-size:14px}</style></head><body><div class="wrap">
<header><div><h1>Item - Activate Listing</h1><div class="ver">Version 1.5 • Bulk Relist Diagnostic</div></div><div id="conn" class="conn">Checking…</div></header>
<div id="login" class="card" style="display:none"><label>App PIN</label><input id="pin" inputmode="numeric" type="password"><button class="search" onclick="login()">Unlock</button><div id="loginmsg"></div></div>
<div id="main" style="display:none">
<div class="card"><label for="sku">SKU</label><input id="sku" autocomplete="off" autocapitalize="off" placeholder="Scan or enter SKU"><button class="search" onclick="lookup()">Search SellerChamp</button><div id="searchmsg"></div></div>
<div id="product" class="card product"><div class="row"><img id="pic" class="pic"><div class="info"><div id="psku" class="sku"></div><div id="title" class="title"></div><div id="badge" class="badge"></div><div id="extra"></div></div></div>
<a id="seller" class="btn seller" target="_blank">Open in SellerChamp Products</a><button id="activate" class="activate" onclick="confirmActivate()">ACTIVATE LISTING</button><button class="clear" onclick="resetForm()">Next Item</button><div id="actionmsg"></div><div id="diagnostics" class="diag" style="display:none"><h3>Activation Diagnostics</h3><div id="diagbody"></div></div></div>
</div></div>
<div id="modal" class="modal"><div class="modalbox"><h2>Activate this listing?</h2><p id="modaltext"></p><div class="modalbuttons"><button class="clear" onclick="closeModal()">Cancel</button><button class="activate" onclick="activateNow()">Yes, Activate</button></div></div></div>
<script>
let current=null; const tokenKey='scActivateSession';
function auth(){const t=localStorage.getItem(tokenKey);return t?{'Authorization':'Bearer '+t}:{}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...auth(),'Content-Type':'application/json'};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){showLogin();throw new Error('PIN required.')}if(!r.ok && r.status!==202)throw Object.assign(new Error(d.error||'Request failed'),{data:d,status:r.status});if(r.status===202)d._pending=true;return d}
function setConn(t,type=''){const e=document.getElementById('conn');e.textContent=t;e.style.background=type==='ok'?'#d7f3df':type==='bad'?'#ffd9d9':'#e9ecef';e.style.color=type==='ok'?'#12612c':type==='bad'?'#9a1818':'#333'}
async function init(){try{const r=await fetch('/api/status',{headers:auth()});const d=await r.json();if(d.sellerchampConnected)setConn(d.pinRequired&&!d.authenticated?'PIN required':'SellerChamp connected',d.pinRequired&&!d.authenticated?'':'ok');else setConn('Not connected','bad');if(d.pinRequired&&!d.authenticated)showLogin();else showMain()}catch{setConn('Not connected','bad');showMain()}}
function showLogin(){document.getElementById('login').style.display='block';document.getElementById('main').style.display='none';setConn('PIN required');setTimeout(()=>document.getElementById('pin').focus(),100)}
function showMain(){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';setTimeout(()=>document.getElementById('sku').focus(),100)}
async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({pin:document.getElementById('pin').value})});if(d.session)localStorage.setItem(tokenKey,d.session);document.getElementById('loginmsg').innerHTML='<div class="msg ok">Unlocked for this browser.</div>';await init()}catch(e){document.getElementById('loginmsg').innerHTML='<div class="msg err">'+e.message+'</div>'}}
function msg(id,text,cls='wait'){document.getElementById(id).innerHTML=text?'<div class="msg '+cls+'">'+text+'</div>':''}
async function lookup(){const sku=document.getElementById('sku').value.trim();if(!sku)return;current=null;document.getElementById('product').style.display='none';msg('searchmsg','Searching SellerChamp…');try{const d=await api('/api/lookup?sku='+encodeURIComponent(sku));if(d.products.length>1){msg('searchmsg','Multiple Product records matched this SKU. Showing the first exact record; use SellerChamp Products to inspect duplicates.','wait')}else msg('searchmsg','');render(d.products[0])}catch(e){msg('searchmsg',e.message,'err')}}
function render(p){current=p;document.getElementById('product').style.display='block';document.getElementById('psku').textContent='SKU: '+(p.sku||'');document.getElementById('title').textContent=p.title||'(No title returned)';const img=document.getElementById('pic');if(p.image){img.src=p.image;img.style.display='block'}else img.style.display='none';const b=document.getElementById('badge');b.textContent=p.active?'ACTIVE':'INACTIVE'+(p.marketplace_status?' — '+p.marketplace_status:'');b.className='badge '+(p.active?'active':'inactive');document.getElementById('activate').style.display=p.active?'none':'block';document.getElementById('seller').href='https://app2.sellerchamp.com/products?product%5Bquery%5D='+encodeURIComponent(p.sku||'');document.getElementById('extra').textContent='Quantity: '+p.quantity+(p.location?' • Location: '+p.location:'');msg('actionmsg',p.active?'This listing is already active.':'This listing can be activated.',p.active?'ok':'wait')}
function confirmActivate(){if(!current)return;document.getElementById('modaltext').textContent=(current.sku||'')+' — '+(current.title||'');document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function showDiagnostics(attempts){
  const box=document.getElementById('diagnostics'), body=document.getElementById('diagbody');
  if(!attempts||!attempts.length){box.style.display='none';body.innerHTML='';return}
  box.style.display='block';
  body.innerHTML=attempts.map(a=>{
    const response=typeof a.response==='string'?a.response:JSON.stringify(a.response);
    const status=a.after?.marketplace_status||'(could not reread)';
    return '<div class="attempt"><strong>'+esc(a.name)+'</strong><br>HTTP: '+esc(String(a.http))+
      '<br>Accepted: <strong>'+(a.accepted?'YES':'NO')+'</strong>'+
      '<br>SellerChamp response: '+esc(response||'(empty response)')+
      '<br>Status after attempt: <strong>'+esc(status)+'</strong>'+
      (a.polls?.length?'<br>Status checks: '+a.polls.map(p=>esc(p.elapsed_seconds+'s='+String(p.status||'?'))).join(' • '):'')+
      (a.verifiedActive?'<br><strong>✓ VERIFIED ACTIVE'+(a.activation_seconds!=null?' after '+esc(a.activation_seconds)+' seconds':'')+'</strong>':'')+'</div>';
  }).join('');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function activateNow(){
  closeModal();showDiagnostics([]);msg('actionmsg','Testing SellerChamp’s documented API bulk_update with relist=true. If accepted, no other activation request will be sent while the app waits up to 5 minutes…');
  document.getElementById('activate').disabled=true;
  try{
    const d=await api('/api/products/'+encodeURIComponent(current.id)+'/activate',{method:'PUT',body:'{}'});
    showDiagnostics(d.attempts);
    render(d.product);
    showDiagnostics(d.attempts);
    if(d._pending||d.pending){msg('actionmsg','SellerChamp ACCEPTED the relist request, but it was still not reporting ACTIVE after 5 minutes. No second relist request was sent.','wait')}else{msg('actionmsg',d.alreadyActive?'SellerChamp reports this listing is already ACTIVE.':'✓ SellerChamp verified: listing is ACTIVE. The successful method and activation time are shown below.','ok')}
  }catch(e){
    showDiagnostics(e.data?.attempts||[]);
    const st=e.data?.product?.marketplace_status?' Current status: '+e.data.product.marketplace_status:'';
    msg('actionmsg',e.message+st,'err');
  }finally{document.getElementById('activate').disabled=false}
}
function resetForm(){showDiagnostics([]);current=null;document.getElementById('product').style.display='none';document.getElementById('sku').value='';msg('searchmsg','');msg('actionmsg','');document.getElementById('sku').focus()}
document.getElementById('sku').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup()}});document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});init();
</script></body></html>
